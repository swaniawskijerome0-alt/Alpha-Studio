    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          if (rawFetch) {
            var activeFetch = rawFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              }
            });
          }
        } catch (e) {
          // Keep default if restricted
        }
      })();
    </script>
